name = "lunar-grimoire-reminders"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "https://hailrod14.github.io/The-Lunar-Grimoire/"

# database_id is filled in after `wrangler d1 create lunar-grimoire-reminders`
[[d1_databases]]
binding = "DB"
database_name = "lunar-grimoire-reminders"
database_id = "TBD"
